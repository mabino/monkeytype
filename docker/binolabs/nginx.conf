server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    # The CSP is the guarantee behind "no third-party services": even if an
    # upstream merge adds a tracker, the browser refuses to load or call it.
    # 'unsafe-inline' covers the two small inline scripts and inline styles in
    # index.html; 'wasm-unsafe-eval' is not needed.
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";

    # add_header in a location drops the server-level ones, so every
    # location that sets its own header includes the full set again.
    include /etc/nginx/snippets/binolabs-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Upstream's base config (all backend features off), generated at build.
    location = /api/configuration {
        default_type application/json;
        include /etc/nginx/snippets/binolabs-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /api/configuration =503;
    }

    # No backend in this build; answer API calls locally and fast.
    location /api/ {
        default_type application/json;
        include /etc/nginx/snippets/binolabs-headers.conf;
        add_header Cache-Control "no-store" always;
        return 503 '{"message":"This build has no backend (accounts are disabled)."}';
    }

    # Hashed build assets never change.
    location ~* ^/(js|css|webfonts)/ {
        include /etc/nginx/snippets/binolabs-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /sw.js {
        include /etc/nginx/snippets/binolabs-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
