<!doctype html>
<html lang="en">
  <head>
    <link
      rel="preload"
      href="/webfonts/RobotoMono-Regular.woff2"
      type="font/woff2"
      as="font"
      crossorigin
    />
    <link
      rel="preload"
      href="/webfonts/LexendDeca-Regular.woff2"
      type="font/woff2"
      as="font"
      crossorigin
    />

    <script>
      document.addEventListener("keydown", function (e) {
        if (e.key == "Escape") e.preventDefault();
      });
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>typo | a typing test, based on Monkeytype</title>
    <!-- fallback theme colors -->
    <style>
      :root {
        --bg-color: #0a0b10;
        --main-color: #a78bfa;
        --caret-color: #8b5cf6;
        --sub-color: #6b7280;
        --sub-alt-color: #14151d;
        --text-color: #f3f4f6;
        --error-color: #f87171;
        --error-extra-color: #b91c1c;
        --colorful-error-color: #f87171;
        --colorful-error-extra-color: #b91c1c;
        --nav-focus-opacity: 0;
      }
    </style>
    <!-- last configured theme colors (theme controller), applied before the
    first paint to avoid an initial flash of the default theme (and the body
    background fading from it) -->
    <script>
      try {
        var cachedTheme = localStorage.getItem("firstPaintThemeCss");
        if (cachedTheme) {
          var style = document.createElement("style");
          style.textContent = cachedTheme;
          document.head.appendChild(style);
        }
      } catch (e) {}
    </script>
    <link
      rel="icon"
      type="image/x-icon"
      sizes="32x32"
      href="/images/favicon/favicon.ico"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/favicon/apple-touch-icon.png"
    />
    <link
      rel="mask-icon"
      href="/images/favicon/safari-pinned-tab.svg"
      color="#eee"
    />
    <meta name="msapplication-TileColor" content="#8b5cf6" />
    <meta
      name="msapplication-config"
      content="/images/favicon/browserconfig.xml"
    />
    <meta
      name="name"
      content="typo | a typing test, based on Monkeytype"
    />
    <meta name="image" content="/images/mtsocial.png" />
    <meta
      name="description"
      content="A self-hosted, modified build of Monkeytype (GPL-3.0) by Miodec and contributors, hosted by binolabs. No accounts, no ads, no trackers."
    />
    <!-- <meta
    name="keywords"
    content="typing speed test, typing speedtest, typing test, speedtest, speed test, typing, test, typing-test, typing test, monkey-type, monkeytype, monkey type, monkey-types, monkeytypes, monkey types, types, monkey, type, miodec, wpm, words per minute, typing website, minimalistic, custom typing test, customizable, customisable, themes, random words, smooth caret, smooth, new, new typing site, new typing website, minimalist typing website, minimalistic typing website, minimalist typing test"

  /> -->
    <meta
      name="keywords"
      content="typing test, monkeytype, speed test, typing, test, speed"
    />
    <meta name="author" content="Miodec and Monkeytype contributors; modified by Michael Bino" />
    <meta name="robots" content="noindex" />
    <meta
      property="og:title"
      content="typo | a typing test, based on Monkeytype"
    />
    <meta property="og:url" content="https://typo.binolabs.com/" />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="/images/mtsocial.png"
    />
    <meta
      property="og:description"
      content="A self-hosted, modified build of Monkeytype (GPL-3.0) by Miodec and contributors, hosted by binolabs. No accounts, no ads, no trackers."
    />
    <meta
      name="twitter:title"
      content="typo | a typing test, based on Monkeytype"
    />
    <meta
      name="twitter:image"
      content="/images/mtsocial.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="darkreader-lock" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <style>
      /* 
      Layer order NEEDS to be here and one layer per line.
      This is because vite changes the order of the css imports,
      and the layer definition needs to be at the very very top, otherwise things break.
    */
      @layer normalize;
      @layer theme;
      @layer base;
      @layer components;
      @layer properties;
      @layer vendor;
      @layer custom-styles;
      @layer hidden;
      @layer utilities;
    </style>
    <link rel="stylesheet" class="testtesttest" href="styles/index.scss" />
    <link rel="stylesheet" class="testtest" href="styles/tailwind.css" />
    <link rel="stylesheet" class="test" href="styles/vendor.scss" />
  </head>

  <body class="loading">
    <!-- shown without js or css, so it can't be rendered by solid -->
    <load src="html/warnings.html" />
    <!-- renders the app after the markup above -->
    <script type="module" src="ts/index.tsx"></script>
